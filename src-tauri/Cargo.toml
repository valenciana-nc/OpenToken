[package]
name = "opentoken"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
opentoken-core = { path = "../crates/opentoken-core" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
anyhow.workspace = true
async-trait = "0.1"
tracing.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
png = "0.17"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_TaskScheduler", "Win32_System_Threading", "Win32_Security", "Win32_Security_Credentials", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Registry", "Win32_System_Variant", "Win32_System_Ole"] }
