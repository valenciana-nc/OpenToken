[package]
name = "opentoken-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
sha2 = "0.10"
zeroize = "1"
base64 = "0.22"
toml = "0.8"
notify = "8"
axum = "0.8"
fs2 = "0.4"
directories = "6"
futures-util = "0.3"
async-trait = "0.1"
rusqlite = { version = "0.39", features = ["bundled", "hooks", "limits"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Wmi", "Win32_System_Variant", "Win32_System_Ole", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Win32_Security", "Win32_Security_Credentials", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }

[[bin]]
name = "fake-local-provider"
path = "tests/support/fake_local_provider.rs"
test = false

[[bin]]
name = "fake-codex"
path = "tests/support/fake_codex.rs"
test = false

[dev-dependencies]
tempfile = "3"
